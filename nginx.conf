map_hash_bucket_size 256;
map_hash_max_size 8192;

map $uri $legacy_redirect {
    default "";
    include /etc/nginx/legacy-redirects.map;
}

server {
    listen 80;
    server_name localhost;
    # TLS terminates at Coolify's proxy; keep redirects on the public scheme.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Resolve known moved articles before checking static files.
    if ($legacy_redirect != "") {
        return 301 $legacy_redirect$is_args$args;
    }

    location = /sitemap.xml {
        types { }
        default_type application/xml;
        try_files $uri =404;
    }

    # Missing static pages must not return the homepage with HTTP 200.
    location / {
        try_files $uri $uri/ =404;
    }
}
