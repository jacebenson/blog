name: Indexing checks
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test scripts/nginx-redirects.test.mjs
      - run: npm run build
      - run: python3 scripts/verify-indexing.py
      - name: Verify Nginx redirects and missing pages
        run: |
          docker run -d --name indexing-nginx -p 8088:80 -v "$PWD/dist:/usr/share/nginx/html:ro" -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" -v "$PWD/nginx-redirects.map:/etc/nginx/legacy-redirects.map:ro" nginx:alpine
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8088/sitemap.xml >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/post/2018-08-14-avoid-these-things/)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/post/2019-11-25-comparing-code-searches/)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/this-page-does-not-exist)" = 404
          curl --silent --head http://localhost:8088/sitemap.xml | grep -i 'Content-Type: application/xml'
      - name: Show Nginx diagnostics
        if: failure()
        run: docker logs indexing-nginx
